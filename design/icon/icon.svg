<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A74FF"/>
      <stop offset="1" stop-color="#1E3FC4"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- ascending bars (analytics) -->
  <g fill="#FFFFFF" fill-opacity="0.92">
    <rect x="256" y="612" width="104" height="186" rx="20"/>
    <rect x="400" y="520" width="104" height="278" rx="20"/>
    <rect x="544" y="430" width="104" height="368" rx="20"/>
  </g>

  <!-- trend line riding over the bars -->
  <polyline points="256,588 400,496 544,406 718,318"
            fill="none" stroke="#FFFFFF" stroke-width="28"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="718,318 648,330 706,384" fill="#FFFFFF"/>

  <!-- car silhouette riding the trend line's peak -->
  <g transform="translate(596,236)" fill="#FFFFFF">
    <path d="M0 66
             C0 40 18 22 46 18
             L74 14
             C92 -14 124 -34 160 -34
             C198 -34 232 -12 248 20
             L268 22
             C294 24 312 44 312 68
             L312 92
             C312 104 302 114 290 114
             L276 114
             C276 92 258 74 236 74
             C214 74 196 92 196 114
             L116 114
             C116 92 98 74 76 74
             C54 74 36 92 36 114
             L18 114
             C8 114 0 106 0 96 Z"/>
    <circle cx="76" cy="114" r="30" fill="#1E3FC4"/>
    <circle cx="76" cy="114" r="14" fill="#FFFFFF"/>
    <circle cx="236" cy="114" r="30" fill="#1E3FC4"/>
    <circle cx="236" cy="114" r="14" fill="#FFFFFF"/>
  </g>
</svg>
